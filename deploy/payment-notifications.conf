# TLS is terminated by Tailscale Funnel. This listener is loopback only.
server {
    listen 127.0.0.1:8790;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    access_log off;

    location ~ ^/(notifications/(payment|xrocket)|return/success|return/failure|health)$ {
        proxy_pass http://127.0.0.1:8789;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
